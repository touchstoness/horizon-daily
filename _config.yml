theme: jekyll-theme-cayman
title: "每日技术简报"
description: "Horizon AI 聚合生成的每日技术与行业简报"
baseurl: "/horizon-daily"
url: "https://touchstoness.github.io"

# Build settings
markdown: kramdown
future: true # Allow future posts to be published
plugins:
  - jekyll-feed
feed:
  path: feed.xml
exclude:
  - ".github"
  - "node_modules"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
